name: Windows installer

# Builds installer\Output\Localirs-Setup.exe on a Windows runner. It runs on every push to claude/combined-app.
# Download the Localirs-Setup artifact from the run page in the Actions tab.
on:
  push:
    branches: [claude/combined-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Restore downloaded tools
        uses: actions/cache@v4
        with:
          path: |
            installer/payload/tools/*.zip
            installer/payload/tools/yt-dlp.exe
          key: installer-tools-${{ hashFiles('installer/tools.json') }}
          save-always: true
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Check the installer scripts parse
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem installer, scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($file.Name): $($_.Message)" }; exit 1 }
          }
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Localirs-Setup
          path: installer/Output/Localirs-Setup.exe
          if-no-files-found: error
