name: Windows installer

# Builds installer\Output\Localirs-Setup.exe on a Windows runner. It runs on every push to claude/combined-app.
# Download the Localirs-Setup artifact from the run page in the Actions tab.
on:
  push:
    branches: [claude/combined-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Localirs-Setup
          path: installer/Output/Localirs-Setup.exe
          if-no-files-found: error
