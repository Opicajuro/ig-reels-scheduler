name: Windows installer

# Builds installer\Output\Localirs-Setup.exe on a Windows runner. It runs on every push to claude/combined-app.
# Each successful build is published as a GitHub Release, which downloads from GitHub's fast download servers and can
# be resumed. The newest one is always at /releases/latest/download/Localirs-Setup.exe.
on:
  push:
    branches: [claude/combined-app]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Publishing a release needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The downloads folder also holds weed.exe, built once per SeaweedFS version (v2: the entries before it had none).
      # It is saved after the build step even when the build fails: Get-Tool deletes a failed download, and a failed
      # go build leaves no weed.exe.
      - name: Restore downloaded tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: installer/downloads
          key: installer-tools-v2-${{ hashFiles('installer/tools.json') }}
      # Go is only needed to build weed.exe, which the restored tools may already hold.
      - uses: actions/setup-go@v5
        if: hashFiles('installer/downloads/weed-*.exe') == ''
        with:
          go-version: "1.26.6"
      - name: Restore the pnpm store
        uses: actions/cache@v4
        with:
          path: installer/pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: installer/next-cache
          key: next-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-cache-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Check the installer scripts parse
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem installer, scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($file.Name): $($_.Message)" }; exit 1 }
          }
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1
      - name: Save downloaded tools
        if: ${{ !cancelled() && steps.tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: installer/downloads
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Localirs-Setup
          path: installer/Output/Localirs-Setup.exe
          if-no-files-found: error
      - name: Publish the installer as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: localirs-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Localirs build ${{ github.run_number }}
          body: |
            Windows installer built from ${{ github.sha }} on ${{ github.ref_name }}.
            Download Localirs-Setup.exe below, run it, and follow the setup window.
          files: installer/Output/Localirs-Setup.exe
          make_latest: true
          fail_on_unmatched_files: true
